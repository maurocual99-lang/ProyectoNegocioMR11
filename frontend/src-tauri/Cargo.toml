[package]
name = "frontend"
version = "0.1.0"
description = "Sistema de gestión Mini Mercado Ruta 11"
authors = ["MR11"]
edition = "2021"


[lib]
name = "frontend_lib"
crate-type = [
    "staticlib",
    "cdylib",
    "rlib"
]


[build-dependencies]
tauri-build = {
    version = "2",
    features = []
}


[dependencies]

tauri = {
    version = "2",
    features = []
}

tauri-plugin-opener = "2"

tauri-plugin-shell = "2"

tauri-plugin-updater = "2"

tauri-plugin-single-instance = "2"

serde = {
    version = "1",
    features = [
        "derive"
    ]
}

serde_json = "1"
